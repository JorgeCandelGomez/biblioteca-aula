services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-biblioteca}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - red-biblioteca
    restart: unless-stopped

  web:
    build: .
    ports:
      - "80:5000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-biblioteca}
      SECRET_KEY: ${SECRET_KEY:-clave_secreta_produccion}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - red-biblioteca
    restart: unless-stopped

networks:
  red-biblioteca:

volumes:
  datos-postgres:
