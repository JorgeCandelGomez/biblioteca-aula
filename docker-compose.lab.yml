services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-biblioteca}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
    ports:
      - "5432:5432"
    volumes:
      - datos-postgres-lab:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - red-lab

  web:
    build: .
    ports:
      - "8080:5000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-biblioteca}
      SECRET_KEY: ${SECRET_KEY:-clave_dev}
      FLASK_ENV: development
      FLASK_DEBUG: "1"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - red-lab
    command: ["python", "-m", "flask", "run", "--host=0.0.0.0", "--port=5000"]

networks:
  red-lab:

volumes:
  datos-postgres-lab:
